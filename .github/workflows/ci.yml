name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      - run: swift test

  test-ios:
    name: Build and test (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Device names change with every runner image, so pick an iPhone on
      # the newest installed iOS runtime instead of naming one.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+-[0-9]+$"))
              | {runtime: .key, device: (.value[] | select(.name | startswith("iPhone")))}]
            | sort_by(.runtime | [scan("[0-9]+") | tonumber]) | last | .device.udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: >
          xcodebuild test
          -scheme swift-rich-text-editor
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
